[project]
name = "rantera-model-platform"
version = "0.1.0"
description = "Secure internal API platform for Rantera foundation models."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "google-auth[requests]>=2.30,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "anyio[trio]>=4,<5",
    "pytest-anyio>=0.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
